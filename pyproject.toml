[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "semantic-knowledge"
version = "0.1.0"
description = "Построение семантической модели знаний"
requires-python = ">=3.12"
dependencies = ["pydantic>=2", "pydot>=3", "typer>=0.12"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9", "mypy>=1.10"]

[project.scripts]
semantic-knowledge = "semantic_knowledge.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.mypy]
python_version = "3.12"
files = ["src"]
